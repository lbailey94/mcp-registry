name: WhiteMagic contribution validation
on:
  push:
    branches: [codex/portfolio-registry-build-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 15eed84cf6c2b7344d20a09566ada65da8ebb25f
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Official registry validation
        run: go run ./cmd/validate --name whitemagic
      - name: Official registry image and tool build
        run: go run ./cmd/build --tools whitemagic
